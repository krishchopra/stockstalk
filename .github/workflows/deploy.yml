name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Debug - Test network connectivity
        run: |
          echo "GitHub Runner IP:"
          curl -s https://api.ipify.org
          echo ""
          echo "Testing TCP connection to EC2..."
          nc -zv ${{ secrets.EC2_HOST }} 22 -w 10 || echo "NC connection failed"
          echo "Testing with timeout..."
          timeout 10 bash -c "cat < /dev/null > /dev/tcp/${{ secrets.EC2_HOST }}/22" && echo "TCP connection succeeded" || echo "TCP connection failed"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60s
          command_timeout: 30m
          debug: true
          script: |
            set -e
            echo "Navigating to project directory..."
            cd ~/stockstalk

            echo "Pulling latest changes..."
            git pull origin main

            echo "Current commit:"
            git log -1 --oneline

            echo "🛑 Stopping existing containers..."
            docker-compose down

            echo "🔨 Building and starting containers..."
            docker-compose up --build -d

            echo "⏳ Waiting for container to be healthy..."
            sleep 5

            echo "Container status:"
            docker-compose ps

            echo "Recent logs:"
            docker-compose logs --tail=20

            echo "✅ Deployment complete!"
