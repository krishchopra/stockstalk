version: '3.8'

services:
  # Combined scheduler and API server
  stockstalk:
    build: .
    container_name: stockstalk
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./config.json:/app/config.json:ro
      - stockstalk_data:/app/data
      - ./logs:/app/logs
    environment:
      # AWS credentials (or use IAM role on EC2)
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
    command: python -m stockstalk --server
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Scheduler-only service (if you want to run them separately)
  stockstalk-scheduler:
    build: .
    container_name: stockstalk-scheduler
    restart: unless-stopped
    profiles:
      - scheduler
    volumes:
      - ./config.json:/app/config.json:ro
      - stockstalk_data:/app/data
      - ./logs:/app/logs
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
    command: python -m stockstalk
    depends_on:
      stockstalk:
        condition: service_healthy

volumes:
  stockstalk_data:
    driver: local
