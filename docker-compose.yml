services:
  # Combined scheduler and API server
  stockstalk:
    build: .
    container_name: stockstalk
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - stockstalk_data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      # Database - persist in mounted volume
      - DATABASE_URL=sqlite+aiosqlite:///./data/stockstalk.db
      # Twilio credentials
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
      # App settings (all have sensible defaults)
      - MIN_PRIORITY=${MIN_PRIORITY:-medium}
      - COOLDOWN_MINUTES=${COOLDOWN_MINUTES:-60}
      - MAX_ALERTS_PER_HOUR=${MAX_ALERTS_PER_HOUR:-10}
      - CHECK_INTERVAL_MINUTES=${CHECK_INTERVAL_MINUTES:-60}
      - DATA_LOOKBACK_DAYS=${DATA_LOOKBACK_DAYS:-30}
    command: python -m stockstalk --server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Scheduler-only service (if you want to run them separately)
  stockstalk-scheduler:
    build: .
    container_name: stockstalk-scheduler
    restart: unless-stopped
    profiles:
      - scheduler
    volumes:
      - stockstalk_data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/stockstalk.db
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
      - MIN_PRIORITY=${MIN_PRIORITY:-medium}
      - COOLDOWN_MINUTES=${COOLDOWN_MINUTES:-60}
      - MAX_ALERTS_PER_HOUR=${MAX_ALERTS_PER_HOUR:-10}
      - CHECK_INTERVAL_MINUTES=${CHECK_INTERVAL_MINUTES:-60}
      - DATA_LOOKBACK_DAYS=${DATA_LOOKBACK_DAYS:-30}
    command: python -m stockstalk
    depends_on:
      - stockstalk

volumes:
  stockstalk_data:
    driver: local
