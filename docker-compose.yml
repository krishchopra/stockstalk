services:
  # Combined scheduler and API server
  stockstalk:
    build: .
    container_name: stockstalk
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./config.json:/app/config.json:ro
      - stockstalk_data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      # AWS credentials (or use IAM role on EC2)
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      # Twilio credentials
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
    command: python -m stockstalk --server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Scheduler-only service (if you want to run them separately)
  stockstalk-scheduler:
    build: .
    container_name: stockstalk-scheduler
    restart: unless-stopped
    profiles:
      - scheduler
    volumes:
      - ./config.json:/app/config.json:ro
      - stockstalk_data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
    command: python -m stockstalk
    depends_on:
      - stockstalk

volumes:
  stockstalk_data:
    driver: local
