[project]
name = "stockstalk"
version = "0.1.0"
description = "A stock listening app that monitors stocks and sends notifications via Beeper"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "yfinance>=0.2.33",
    "pandas>=2.1.4",
    "numpy>=1.26.2",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "schedule>=1.2.1",
    "flask>=3.0.0",
    "twilio>=8.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "black>=23.12.1",
    "mypy>=1.7.1",
    "types-requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=stockstalk --cov-report=term-missing"
